<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141414">
    <meta name="robots" content="noindex">
    <title>Sem conexão — Miplace Group</title>
    <style>
        :root {
            --paper: #f5f2ea;
            --ink: #141414;
            --ink-2: #4a4641;
            --ink-3: #79736b;
            --accent: #8c1d1d;
            --gold: #b9965a;
            --line: rgba(20, 20, 20, 0.14);
            --line-strong: rgba(20, 20, 20, 0.32);
            --font-display: Georgia, "Times New Roman", serif;
            --font-sans: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--paper);
            color-scheme: light;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding:
                calc(24px + env(safe-area-inset-top))
                calc(24px + env(safe-area-inset-right))
                calc(24px + env(safe-area-inset-bottom))
                calc(24px + env(safe-area-inset-left));
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .shell {
            width: min(100%, 680px);
            border-top: 1px solid var(--line-strong);
            padding-top: clamp(40px, 8vw, 88px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: clamp(48px, 9vw, 96px);
        }

        .mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: 1px solid var(--ink);
            color: var(--ink);
            font-family: var(--font-display);
            font-size: 22px;
            line-height: 1;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-2);
        }

        .tagline {
            margin-bottom: 18px;
            color: var(--accent);
        }

        h1 {
            max-width: 12ch;
            margin-bottom: 24px;
            font-family: var(--font-display);
            font-size: clamp(46px, 9vw, 92px);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.04em;
        }

        h1 em {
            color: var(--accent);
            font-weight: 400;
        }

        p {
            max-width: 46ch;
            color: var(--ink-2);
            font-size: clamp(16px, 2.2vw, 18px);
            line-height: 1.65;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 36px;
        }

        .button {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 28px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-decoration: none;
            text-transform: uppercase;
            transition: background-color 180ms ease, color 180ms ease;
        }

        .button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 4px;
        }

        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 24px;
            margin-top: clamp(56px, 10vw, 112px);
            padding-top: 20px;
            border-top: 1px solid var(--line);
            color: var(--ink-2);
            font-size: 11px;
            letter-spacing: 0.04em;
        }

        @media (prefers-reduced-motion: no-preference) {
            .shell {
                animation: rise 420ms ease both;
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }

        @media (max-width: 480px) {
            .footer {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="brand">
            <span class="mark" aria-hidden="true">M</span>
            <span class="eyebrow">Miplace Group</span>
        </div>

        <p class="eyebrow tagline">Tecnologia global. Cuidado local.</p>
        <h1>Sem <em>conexão.</em></h1>
        <p>O catálogo não conseguiu falar com a rede agora. Seus favoritos continuam salvos neste aparelho. Verifique a conexão e tente novamente.</p>

        <div class="actions">
            <a class="button" href="/">Tentar novamente</a>
        </div>

        <footer class="footer">
            <span>Miplace Group © 2026</span>
            <span>Piracicaba · Amparo, SP</span>
        </footer>
    </main>
</body>
</html>
